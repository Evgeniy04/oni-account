name: oni

services:
  postgres:
    image: postgres
    container_name: account-db-postgres
    environment:
      POSTGRES_DB: account-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_secret_password
    ports:
      - "5433:5432"
    volumes:
      - book_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis
  redis:
    container_name: book-redis
    image: redis:7.2
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - 6379:6379
    networks:
      - redis-network
    env_file: [.env]

  redis-commander:
    container_name: book-redis-commander
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      REDIS_HOSTS: redis
      REDIS_HOST: redis
      REDIS_PORT: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: ["29094:8081"]
    networks:
      - redis-network
    env_file: [.env]

volumes:
  redis_data:
    driver: local
  book_postgres_data:

networks:
  redis-network:
    driver: bridge